<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <!-- LscSync icon: single source for every variant (tools/generate-icons.sh).
       macOS grid: the rounded square fills 80% of the canvas. -->
  <defs>
    <clipPath id="screen">
      <rect x="32.4" y="43.6" width="35.2" height="19" rx="2.6"/>
    </clipPath>
  </defs>
  <rect x="10" y="10" width="80" height="80" rx="18" fill="#141416"/>
  <rect x="10.5" y="10.5" width="79" height="79" rx="17.5" fill="none" stroke="#2C2C30"/>
  <!-- The 3 Ambilight zones -->
  <g clip-path="url(#screen)">
    <rect x="32" y="43" width="12.2" height="21" fill="#D9662B"/>
    <rect x="44.6" y="43" width="11.2" height="21" fill="#7A4FD0"/>
    <rect x="56.2" y="43" width="12" height="21" fill="#1FA38A"/>
  </g>
  <!-- Screen, stand and rays of light (same glyph as the menu bar) -->
  <g fill="none" stroke="#F2F1EF" stroke-linecap="round">
    <rect x="30.4" y="41.6" width="39.2" height="23" rx="4.2" stroke-width="3.9"/>
    <line x1="43.3" y1="70.7" x2="56.7" y2="70.7" stroke-width="4.2"/>
    <g stroke-width="4.5">
      <line x1="50" y1="27" x2="50" y2="34.3"/>
      <line x1="34" y1="29.8" x2="37.7" y2="35.9"/>
      <line x1="66" y1="29.8" x2="62.3" y2="35.9"/>
    </g>
  </g>
</svg>
