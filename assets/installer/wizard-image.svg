<svg xmlns="http://www.w3.org/2000/svg" width="202" height="386" viewBox="0 0 202 386">
  <!-- Windows installer side panel (welcome and finish pages). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18181B"/>
      <stop offset="1" stop-color="#0E0E10"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="32.4" y="43.6" width="35.2" height="19" rx="2.6"/>
    </clipPath>
  </defs>
  <rect width="202" height="386" fill="url(#bg)"/>
  <!-- The glyph of assets/icon/lscsync.svg, without its rounded square -->
  <g transform="translate(21 95) scale(1.6)">
    <g clip-path="url(#screen)">
      <rect x="32" y="43" width="12.2" height="21" fill="#D9662B"/>
      <rect x="44.6" y="43" width="11.2" height="21" fill="#7A4FD0"/>
      <rect x="56.2" y="43" width="12" height="21" fill="#1FA38A"/>
    </g>
    <g fill="none" stroke="#F2F1EF" stroke-linecap="round">
      <rect x="30.4" y="41.6" width="39.2" height="23" rx="4.2" stroke-width="3.9"/>
      <line x1="43.3" y1="70.7" x2="56.7" y2="70.7" stroke-width="4.2"/>
      <g stroke-width="4.5">
        <line x1="50" y1="27" x2="50" y2="34.3"/>
        <line x1="34" y1="29.8" x2="37.7" y2="35.9"/>
        <line x1="66" y1="29.8" x2="62.3" y2="35.9"/>
      </g>
    </g>
  </g>
  <rect x="0" y="376" width="67" height="10" fill="#D9662B"/>
  <rect x="67" y="376" width="68" height="10" fill="#7A4FD0"/>
  <rect x="135" y="376" width="67" height="10" fill="#1FA38A"/>
</svg>
