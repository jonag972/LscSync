[package]
name = "lscsync-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "LSC Smart Connect panels that follow your screen and your music"

[[bin]]
name = "lscsync"
path = "src/main.rs"

[dependencies]
lscsync-core = { workspace = true }
lscsync-engine = { workspace = true }
lscsync-platform = { workspace = true }
lscsync-cloud = { workspace = true }
qrcode = { workspace = true }
gpui-kit = { workspace = true }
gpui-tray = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
serde = { workspace = true }
rust-i18n = "4"
sys-locale = "0.3"
ureq = { version = "3", features = ["json"] }
base64 = { workspace = true }
thiserror = { workspace = true }
ed25519-dalek = "2"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

# Windows .exe icon; build.rs only uses it for that target.
[build-dependencies]
embed-resource = "3"

# Debian/Ubuntu package (tools/deb.sh). Paths are relative to this crate.
[package.metadata.deb]
name = "lscsync"
maintainer = "Jonathan Gromat <128492963+jonag972@users.noreply.github.com>"
copyright = "2026 Jonathan Gromat"
section = "utils"
extended-description = """\
Syncs LSC Smart Connect (Tuya) light panels with the screen (Ambilight, \
3 zones), a single dominant color, or the music, entirely over the local \
network."""
# The GPU renderer loads Vulkan at runtime, which $auto cannot see.
depends = "$auto, libvulkan1"
assets = [
    ["target/release/lscsync", "usr/bin/", "755"],
    ["../../assets/linux/lscsync.desktop", "usr/share/applications/", "644"],
    ["../../assets/icon/lscsync-256.png", "usr/share/icons/hicolor/256x256/apps/lscsync.png", "644"],
]
