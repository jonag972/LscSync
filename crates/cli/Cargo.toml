[package]
name = "lscsync-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lscsync-cli"
path = "src/main.rs"

[dependencies]
lscsync-core = { workspace = true }
lscsync-engine = { workspace = true }
lscsync-platform = { workspace = true }
lscsync-cloud = { workspace = true }
qrcode = { workspace = true }
rustuya = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
aes-gcm = "0.11"
hmac = "0.13"
sha2 = "0.11"
tokio = { workspace = true, features = ["net", "io-util", "macros", "rt-multi-thread"] }
