[package]
name = "lscsync-cloud"
version.workspace = true
edition.workspace = true
license.workspace = true

# The only crate that talks to the internet: Tuya's QR code login, used once
# during setup to fetch the devices' local keys.

[dependencies]
lscsync-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
ureq = { version = "3", features = ["json"] }
aes-gcm = "0.11"
hmac = "0.13"
sha2 = "0.11"
md-5 = "0.11"
rand = "0.9"
